# 역할 워커 프로필 설정 예시 (디자이너 기준)
# 위치: ~/.hermes/profiles/designer/config.yaml
#   (Windows: %LOCALAPPDATA%\hermes\profiles\designer\config.yaml)
#
# 다른 역할(marketer, perf)도 같은 뼈대에 채널 ID와 스킬만 바꿔 쓰면 된다.

model:
  provider: "anthropic"
  # 워커는 토큰의 대부분을 쓰는 쪽이다. 팀장보다 한 단계 저렴한 모델을 기본으로 두고,
  # 어려운 카드만 `hermes kanban set-model <카드ID> <모델>`로 올려 쓴다.
  default: "claude-sonnet-4-6"

terminal:
  backend: local
  # 절대경로로 고정한다. "." 은 "Hermes를 실행한 디렉터리"라서 서비스로 띄우면 예측이 안 된다.
  cwd: "/srv/hermes-work/design"

approvals:
  mode: manual          # 사내 공용 머신이면 smart 대신 manual 권장
  deny:
    - "git push --force*"
    - "rm -rf /*"

# 이 에이전트가 슬랙에서 어떻게 행동할지
slack:
  require_mention: true          # 채널에서는 멘션받았을 때만
  ignore_other_user_mentions: true   # "@길동님 봐주세요" 같은 사람 간 대화엔 끼어들지 않음

  # 초대돼 있어도 여기 없는 방이면 조용히 무시한다. (1:1 DM은 예외로 항상 허용)
  allowed_channels:
    - "C0123456789"   # #디자인
    - "C0987654321"   # #프로젝트-A

  # 방마다 다른 역할 톤을 주입한다. 대화 기록에는 남지 않고 매 턴 주입된다.
  channel_prompts:
    "C0123456789": |
      이 방은 디자인 리뷰방이다. 시안 피드백은 항상
      (1) 목적 적합성 (2) 가독성 (3) 브랜드 일관성 순서로 짚고,
      마지막에 "다음 액션" 한 줄로 끝낸다.

  # 방에서 새 세션이 시작될 때 특정 스킬을 자동으로 물린다. (세션 시작 시 1회)
  channel_skill_bindings:
    - id: "C0123456789"
      skills:
        - creative-design-md

# 같은 방이라도 사람마다 대화 맥락을 분리한다(기본값 true).
# 팀 전체가 하나의 맥락을 공유해야 하면 false로 바꾸되, 한 사람의 /reset이
# 모두의 세션을 지운다는 점을 감안할 것.
group_sessions_per_user: true

# 이 에이전트가 스스로 하위 작업을 병렬로 돌릴 때의 상한
delegation:
  max_concurrent_children: 3
  max_spawn_depth: 1
  model: "claude-sonnet-4-6"
  provider: "anthropic"
